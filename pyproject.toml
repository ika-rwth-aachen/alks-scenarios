[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alks-scenarios"
authors = [
    {name = "Lennart Vater", email = "lennart.vater@rwth-aachen.de"},
    {name = "Sven Tarlowski", email = "sven.tarlowski@ika.rwth-aachen.de"},
    {name = "ika - RWTH Aachen University", email = "opensource@ika.rwth-aachen.de"}
]
maintainers = [
    {name = "Sven Tarlowski", email = "sven.tarlowski@ika.rwth-aachen.de"}
]
description = "Recreate test scenarios from UN/ECE R.157 E/ECE/TRANS/505/Rev.3/Add.156/Amend.4 Annex 3 pp. 45-56 using simple-scenario."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
version = "0.2.0"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=1.24.4",
    "simple-scenario[commonroad]>=1.0.1",
    "tqdm>=4.67.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
]

[dependency-groups]
dev = [
    "coverage>=7.6.1",
    "pycobertura>=4.0.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.11",
]
build = [
    "build>=1.2.2.post1",
    "twine>=6.1.0",
]


[tool.setuptools]
packages = [
    "alks_scenarios"
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "test"
]

[tool.ruff]
output-format="concise"

[tool.ruff.lint]
select = [
    "AIR001",
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "B",
    "A",
    "COM",
    "C",
    "DTZ",
    "T",
    "DJ",
    "EM",
    "ERA001",
    "EXE",
    "FA",
    "INT",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "INP",
    "PIE",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "SLOT",
    "TID",
    "TCH",
    "ARG",
    "PTH",
    "FLY",
    "I",
    "NPY",
    "N",
    "PD",
    "PERF",
    "E",
    "W",
    "F",
    "PGH",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "UP",
    "FURB",
    "RUF",
    "TRY",
    "TD",
]
ignore = [
    "ANN002",
    "ANN003",
    "PLR2004",
    "PLR0913",
    "PLR0915",
    "E501",
    "B019",
    "D",
    "I001",
    "FBT",
    "RET504",
    "C901",
    "SIM108",
    "FIX",  # Fixes
    "TRY002",
    "TRY003",
    "Q003",
    "COM812",
    "SIM103",
    "TID252",
    "RUF012",
    "SIM117",
    "TD003",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test/*.py" = ["F841", "S101", "T201", "ANN"]
"examples/generate_gifs.py" = ["INP001"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:"
]
